name: 📦 Release APK (signed)

# Manual workflow: builds signed arm64-v8a release APK, zips it,
# and uploads the zip as a run artifact.
# Nothing else — no version bump, no distribution, no uploads anywhere.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build signed APKs and zip
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Use local JDK for Gradle daemon
        run: |
          rm -f gradle/gradle-daemon-jvm.properties
          echo "org.gradle.java.installations.auto-download=false" >> gradle.properties

      - name: Create Keystore properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Build signed release APKs
        run: ./gradlew :app:assembleRelease -PAPP_VERSION_CODE=33

      - name: Rename and Zip all APKs
        run: |
          VERSION_NAME=$(grep "^APP_VERSION_NAME=" gradle.properties | cut -d'=' -f2 | tr -d '\r' | tr -d ' ')
          mkdir -p dist-apk
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            [ -f "$apk" ] || continue
            arch=$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            cp "$apk" "dist-apk/PixelMusic-${arch}-v${VERSION_NAME}.apk"
          done
          cd dist-apk
          zip -j "$GITHUB_WORKSPACE/PixelMusic-signed-apks.zip" *.apk
          unzip -l "$GITHUB_WORKSPACE/PixelMusic-signed-apks.zip"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelMusic-signed-apks
          path: PixelMusic-signed-apks.zip
