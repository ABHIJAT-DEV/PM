name: 🧹 Cleanup Dead Files

on:
  workflow_dispatch:

jobs:
  cleanup:
    name: Remove Dead Files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Remove dead files
        run: |
          git rm -f \
            app/src/main/java/com/saurav/pixelmusic/presentation/screens/FolderExplorerScreen.kt \
            app/src/main/java/com/saurav/pixelmusic/presentation/components/scoped/KeylineListScope.kt \
            app/src/main/java/com/saurav/pixelmusic/ui/modifiers/ProgressiveBlurModifier.kt \
            app/src/main/java/com/saurav/pixelmusic/utils/PixelPlayerListener.kt \
            app/src/main/java/com/saurav/pixelmusic/presentation/components/scoped/CustomNavigationBarItem.kt \
            app/src/main/java/com/saurav/pixelmusic/presentation/components/scoped/Expansion.kt \
            app/src/main/java/com/saurav/pixelmusic/presentation/components/ExpressiveOfflineState.kt \
            app/src/main/java/com/saurav/pixelmusic/presentation/components/NavigationTitle.kt \
            app/src/main/java/com/saurav/pixelmusic/presentation/components/subcomps/AutoSizingTextGlance.kt \
            tools/migrate_presentation_strings.py \
            app/performance_analysis.md \
            app/src/main/res/drawable/instagram.xml \
            app/src/main/res/drawable/rounded_music_cast_24.xml \
            app/src/main/res/drawable/rounded_hourglass_24.xml \
            app/src/main/res/drawable/rounded_developer_board_24.xml \
            app/src/main/res/drawable/rounded_auto_delete_24.xml \
            app/src/main/res/drawable/rounded_manage_search_24.xml \
            app/src/main/res/drawable/rounded_question_mark_24.xml \
            app/src/main/res/drawable/rounded_send_24.xml \
            app/src/main/res/drawable/rounded_tv_24.xml \
            app/src/main/res/drawable/generate_playlist_ai.xml \
            app/src/main/res/drawable/ic_navidrome.xml \
            app/src/main/res/raw/nfc_ripple.agsl || true

      - name: Remove this workflow file
        run: |
          git rm -f .github/workflows/cleanup.yml || true

      - name: Commit and push changes
        run: |
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: remove dead code, unused files, and unused drawables"
            git push origin main
          fi
