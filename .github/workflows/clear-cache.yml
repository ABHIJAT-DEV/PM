name: 🧹 Clear Cache

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  clear-cache:
    name: Clear All GitHub Actions Caches
    runs-on: ubuntu-latest
    steps:
      - name: Delete all caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Listing and deleting all caches for $GH_REPO..."
          while true; do
            CACHE_IDS=$(gh cache list --repo "$GH_REPO" --limit 100 --json id --jq '.[].id' 2>/dev/null || true)
            if [ -z "$CACHE_IDS" ]; then
              echo "No more caches found."
              break
            fi
            for id in $CACHE_IDS; do
              echo "Deleting cache ID: $id"
              gh cache delete "$id" --repo "$GH_REPO" || true
            done
          done
          echo "Done clearing caches."
