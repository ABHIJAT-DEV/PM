name: 🔨 Manual Test Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Use local JDK for Gradle daemon
        # gradle/gradle-daemon-jvm.properties pins a JetBrains JDK via dead Foojay
        # links; drop it so the daemon uses the setup-java JDK 21 directly.
        # Also disable toolchain auto-download so Gradle never tries Foojay again.
        run: |
          rm -f gradle/gradle-daemon-jvm.properties
          echo "org.gradle.java.installations.auto-download=false" >> gradle.properties

      - name: Create Keystore properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Patch App for Testing
        run: |
          # 1. Point the updater at the test channel of the middleman worker
          sed -i 's|pixelmusic-updater.atappu805.workers.dev/updater/check|pixelmusic-updater.atappu805.workers.dev/updater/check?channel=test|g' app/src/main/java/com/saurav/pixelmusic/utils/InAppUpdater.kt

          # 2. Safely change ONLY the main applicationId (will not touch applicationIdSuffix)
          sed -i 's/applicationId = ".*"/applicationId = "com.saurav.pixelmusic.test"/' app/build.gradle.kts
          
          # 3. Change App Name to strictly "Test"
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Test<\/string>/g' app/src/main/res/values/strings.xml

          # Keep R8 Full Mode and dexLayoutOptimization enabled (matching release & origin config)

      - name: Calculate Sequential Version
        run: |
          # Fetch all recent releases and pick the highest numeric test-build-N tag
          LAST_NUM=$(curl -s -H "Authorization: Bearer ${{ secrets.TEST_REPO_PAT }}" "https://api.github.com/repos/Test-px/PixelMusic/releases?per_page=100" \
            | jq -r '.[].tag_name // empty' \
            | grep -E '^test-build-[0-9]+$' \
            | sed 's/[^0-9]*//g' \
            | sort -nr \
            | head -n 1)

          if [ -z "$LAST_NUM" ]; then
            NEXT_NUM=1
          else
            NEXT_NUM=$((LAST_NUM + 1))
          fi

          echo "Highest existing test build: ${LAST_NUM:-none}, next version: test-build-$NEXT_NUM"
          echo "NEXT_NUM=$NEXT_NUM" >> $GITHUB_ENV

      - name: Build Release APK
        # assembleRelease already includes the Kotlin compilation tasks it needs.
        # Keeping this as one Gradle invocation avoids paying configuration/worker
        # startup overhead twice on every test build.
        # --no-daemon: CI runners are fresh VMs (no daemon reuse benefit), and this
        # bypasses the broken gradle-daemon-jvm.properties toolchain spec entirely.
        run: |
          ./gradlew :app:assembleRelease -PAPP_VERSION_NAME="test-build-${{ env.NEXT_NUM }}" --profile
          python3 - << 'PY' || true
          import glob, re
          files = sorted(glob.glob("build/reports/profile/profile-*.html"))
          if files:
              html = open(files[-1], encoding="utf-8", errors="ignore").read()
              rows = re.findall(r'<tr>\s*<td[^>]*>(:[^<]+)</td>\s*<td[^>]*class="numeric"[^>]*>([^<]+)</td>', html)
              print("=== TOP 15 SLOWEST GRADLE TASKS ===")
              for task, dur in rows[:15]:
                  print(f"  {dur:>10}  {task}")
          PY

      - name: Prepare Release Notes
        run: |
          echo -e "### 🚀 Official APK Page: [pixelmusic.pages.dev](https://pixelmusic.pages.dev)\n\n---\n" > release_notes.txt
          if [ -f changelog.txt ]; then
            cat changelog.txt >> release_notes.txt
          fi

      - name: Upload to Testing Repository
        uses: softprops/action-gh-release@v2
        with:
          repository: Test-px/PixelMusic
          token: ${{ secrets.TEST_REPO_PAT }}
          tag_name: test-build-${{ env.NEXT_NUM }}
          name: Test Build ${{ env.NEXT_NUM }}
          make_latest: true
          body_path: release_notes.txt
          files: app/build/outputs/apk/release/*.apk

      - name: 🧹 Clean Up Older Releases (Keep Last 3)
        env:
          GH_TOKEN: ${{ secrets.TEST_REPO_PAT }}
        run: |
          echo "Keeping the last 3 releases and cleaning up older ones..."
          gh release list --repo Test-px/PixelMusic --limit 100 --json tagName -q ".[].tagName" | tail -n +4 | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "test-build-${{ env.NEXT_NUM }}" ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --repo Test-px/PixelMusic --cleanup-tag -y || true
            fi
          done

      - name: Sync Fork Automatically (Test-px/PixelMusic, stripped)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          git checkout --orphan dist-tmp
          rm -f vz-pixelmusic.jks
          rm -rf .github/workflows

          # Customize README for the Test-px distribution repository
          cat << 'EOF' > README.md
          # 🧪 PixelMusic Test Build (Source Distribution)

          <div align="center">

          # 🚀 DOWNLOAD LATEST TEST APK
          ### 📦 This repository distributes the **source code** for PixelMusic Test Builds.
          ### To download the latest installable test APK, visit our dedicated page:

          # 🌐 [pixelmusic.pages.dev](https://pixelmusic.pages.dev) 🌐

          <br />

          <a href="https://pixelmusic.pages.dev">
            <img src="https://img.shields.io/badge/⚡%20DOWNLOAD%20APK-pixelmusic.pages.dev-FF6F00?style=for-the-badge&logo=android&logoColor=white" height="48" alt="Download APK" />
          </a>
          &nbsp;&nbsp;
          <a href="https://github.com/Test-px/PixelMusic/releases">
            <img src="https://img.shields.io/badge/📦%20TEST%20RELEASES-GitHub%20Releases-2979FF?style=for-the-badge&logo=github&logoColor=white" height="48" alt="GitHub Releases" />
          </a>

          </div>

          ---
          EOF

          git add -A
          git commit -m "chore: sync stripped source with cleared history [skip ci]"
          git push https://x-access-token:${{ secrets.TEST_REPO_PAT }}@github.com/Test-px/PixelMusic.git dist-tmp:main --force
          git checkout main
          git branch -D dist-tmp
