name: 🚀 Final Release Build (Dual-Repo)

on:
  workflow_dispatch: 

env:
  # 🎯 The secondary public repository where APKs will also be published
  TARGET_REPO: 'Saurav-02/PixelMusic'
  # 📦 Distribution repo (updater worker reads releases from here)
  DIST_REPO: 'atappu805/PixelMusic'

jobs:
  build:
    name: 🛠️ Build Signed Release APK & Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to commit the version bump and create local releases

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 🔐 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: ⚙️ Use local JDK for Gradle daemon
        run: |
          rm -f gradle/gradle-daemon-jvm.properties
          echo "org.gradle.java.installations.auto-download=false" >> gradle.properties

      - name: 🔑 Create Keystore properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: 📈 Bump Minor Version (+0.1.0) & Freeze Version Code (33)
        id: versioning
        run: |
          RAW_NAME=$(grep "^APP_VERSION_NAME=" gradle.properties | cut -d'=' -f2 | tr -d '\r' | tr -d ' ')

          IFS='.' read -r MAJOR MINOR PATCH EXTRA <<< "$RAW_NAME"
          MAJOR=${MAJOR:-4}
          MINOR=${MINOR:-4}

          NEW_MINOR=$((MINOR + 1))
          NEW_NAME="${MAJOR}.${NEW_MINOR}.0"
          NEW_CODE=33

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            NEW_NAME=${TAG_NAME#v}
          else
            TAG_NAME="v${NEW_NAME}"
          fi

          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=${NEW_CODE}/" gradle.properties
          sed -i "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=${NEW_NAME}/" gradle.properties

          echo "NEW_CODE=${NEW_CODE}" >> $GITHUB_ENV
          echo "NEW_NAME=${NEW_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: 🔨 Build Release APK
        # If this step fails, the workflow stops here and NOTHING is pushed!
        run: ./gradlew :app:assembleRelease -PAPP_VERSION_CODE=33 -PAPP_VERSION_NAME="${{ env.NEW_NAME }}"

      - name: 🏷️ Rename APKs with Architecture & Version
        run: |
          mkdir -p dist-apk
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            [ -f "$apk" ] || continue
            arch=$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            cp "$apk" "dist-apk/PixelMusic-${arch}-${{ env.TAG_NAME }}.apk"
          done
          ls -lh dist-apk/

      - name: 💾 Commit & Push Version Bump (To Source Repo)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add gradle.properties
          git commit -m "chore: bump version to v${{ env.NEW_NAME }} (Code: ${{ env.NEW_CODE }}) [skip ci]" || echo "No changes to commit"
          git push

      - name: 🌐 Sync Source Code to Saurav-02/PixelMusic & atappu805/PixelMusic
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          git checkout --orphan dist-tmp
          rm -f vz-pixelmusic.jks
          rm -rf .github/workflows
          git add -A
          git commit -m "chore: sync stripped source with cleared history [skip ci]"
          echo "Syncing code to ${{ env.TARGET_REPO }} (master branch)..."
          git push https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/${{ env.TARGET_REPO }}.git dist-tmp:master --force
          echo "Syncing code to ${{ env.DIST_REPO }} (main branch)..."
          git push https://x-access-token:${{ secrets.DIST_REPO_TOKEN }}@github.com/${{ env.DIST_REPO }}.git dist-tmp:main --force
          git checkout main
          git branch -D dist-tmp

      - name: 📝 Read Release Notes from File
        run: |
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          if [ -f changelog.txt ]; then
            cat changelog.txt >> $GITHUB_ENV
          else
            echo "✨ New update available. See repository for details." >> $GITHUB_ENV
          fi
          echo "EOF" >> $GITHUB_ENV

      - name: 🚀 Create GitHub Release & Upload APK (atappu805/Clean)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: 🌟 Release ${{ env.TAG_NAME }}
          make_latest: true
          body: ${{ env.RELEASE_BODY }}
          files: dist-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Create GitHub Release & Upload APK (Saurav-02/PixelMusic)
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: 🌟 Release ${{ env.TAG_NAME }}
          make_latest: true
          body: ${{ env.RELEASE_BODY }}
          files: dist-apk/*.apk

      - name: 🚀 Create GitHub Release & Upload APK (atappu805/PixelMusic)
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.DIST_REPO }}
          token: ${{ secrets.DIST_REPO_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: 🌟 Release ${{ env.TAG_NAME }}
          make_latest: true
          body: ${{ env.RELEASE_BODY }}
          files: dist-apk/*.apk

      - name: 📦 Upload Signed Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 📱 app-release-signed
          path: dist-apk/*.apk
          retention-days: 14
