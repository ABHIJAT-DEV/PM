# Codemagic CI — Clean2.0 (PixelMusic)
# Manual builds only: no automatic triggering is configured here.
# Start a build from the Codemagic app page with "Start new build".
#
# Workflows:
#   debug-apk    — unsigned debug APK, no setup needed. Use it to test the pipe.
#   release-apk  — signed arm64-v8a release APK, same recipe as the GitHub
#                  "Release APK (signed)" workflow. Needs an environment
#                  variable group named "keystore_credentials" containing
#                  KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (all secure),
#                  with the same values as the GitHub repo secrets.
#                  Signing uses vz-pixelmusic.jks from the repo root; the
#                  build writes keystore.properties before running Gradle.

workflows:
  debug-apk:
    name: Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Prepare Gradle (JDK 21)
        script: |
          set -e
          if [ -x /usr/libexec/java_home ]; then
            export JAVA_HOME=$(/usr/libexec/java_home -v 21)
            echo "JAVA_HOME=$JAVA_HOME" >> $CM_ENV
          fi
          java -version
          rm -f gradle/gradle-daemon-jvm.properties
          grep -q "org.gradle.java.installations.auto-download" gradle.properties || echo "org.gradle.java.installations.auto-download=false" >> gradle.properties
          chmod +x gradlew
      - name: Build debug APK
        script: |
          ./gradlew :app:assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  release-apk:
    name: Release APK (signed, arm64)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - keystore_credentials
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Prepare signing and Gradle (JDK 21)
        script: |
          set -e
          if [ -x /usr/libexec/java_home ]; then
            export JAVA_HOME=$(/usr/libexec/java_home -v 21)
            echo "JAVA_HOME=$JAVA_HOME" >> $CM_ENV
          fi
          java -version
          rm -f gradle/gradle-daemon-jvm.properties
          grep -q "org.gradle.java.installations.auto-download" gradle.properties || echo "org.gradle.java.installations.auto-download=false" >> gradle.properties
          printf "storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          chmod +x gradlew
      - name: Build signed release APK
        script: |
          ./gradlew :app:assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/mapping.txt
